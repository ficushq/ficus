id: builder-reviewer
description: >-
  For reviewed results that are not code, such as documents, plans or research: one agent produces the
  deliverable and an independent reviewer checks it, with explicit returns for rework. For reviewed code changes,
  use Reviewed Coding (reviewed-coding) instead.
definition:
  schemaVersion: 1
  name: Reviewed Deliverable (non-code)
  participants:
    builder:
      agentTypeId: engineer
      session: reuse-within-stream
    reviewer:
      agentTypeId: reviewer
      session: reuse-within-stream
  entry: build
  routing:
    mode: flexible
    returnTo: earlier-steps
    delegation: disabled
  limits:
    maxDelegations: 0
    onLimit: request-owner-input
  steps:
    - id: build
      participant: builder
      instructions: Produce the requested deliverable and verify it against the requirements.
      output: The deliverable and verification evidence.

      outcomes:
        completed:
          next: review
    - id: review
      participant: reviewer

      instructions: >-
        Review the deliverable independently. Approve it or request specific changes and a return to you.
        When you approve, this step delivers: no later agent step runs, so once the stream reaches completion-ready
        you are its delivery participant. Follow the delivery instructions in the advance response and finish the
        stream yourself; do not wait for another agent.
      output: An evidence-backed verdict or actionable feedback.

      outcomes:
        approved:
          next: finish
        changes-requested:
          returnTo: build
  completion:
    mode: deliverable
