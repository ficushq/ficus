id: research-brief
description: Research a question, check the evidence independently, and deliver a sourced brief.
definition:
  schemaVersion: 1
  name: Research Brief
  participants:
    researcher:
      agentTypeId: general
      session: reuse-within-stream
    reviewer:
      agentTypeId: general
      session: reuse-within-stream
  entry: research
  routing:
    mode: flexible
    returnTo: earlier-steps
    delegation: disabled
  limits:
    maxDelegations: 0
    onLimit: request-owner-input
  steps:
    - id: research
      participant: researcher
      instructions: >-
        Clarify the research question and decision it informs. Gather primary sources, compare credible
        alternatives, distinguish facts from inference, and produce a concise sourced brief with uncertainty
        and open questions. Do not invent sources.
      output: A brief with source links, findings, confidence, and recommendations within the requested scope.
      outcomes:
        completed:
          next: review
    - id: review
      participant: reviewer

      instructions: >-
        Check that the cited sources support the claims, the scope answers the question, and uncertainty and
        contrary evidence are represented fairly. Request targeted corrections or approve the brief.
        When you approve, this step delivers: no later agent step runs, so once the stream reaches completion-ready
        you are its delivery participant. Follow the delivery instructions in the advance response and finish the
        stream yourself; do not wait for another agent.
      output: A source-checked verdict and any corrections required.
      outcomes:
        approved:
          next: finish
        changes-requested:
          returnTo: research
  completion:
    mode: deliverable
