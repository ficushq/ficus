id: reviewed-coding
description: An engineer implements a change and an independent reviewer checks it before delivery.
definition:
  schemaVersion: 1
  name: Reviewed Coding
  participants:
    engineer:
      agentTypeId: engineer
      session: reuse-within-stream
    reviewer:
      agentTypeId: reviewer
      session: reuse-within-stream
  entry: implement
  routing:
    mode: flexible
    returnTo: earlier-steps
    delegation: disabled
  limits:
    maxDelegations: 0
    onLimit: request-owner-input
  steps:
    - id: implement
      participant: engineer
      instructions: >-
        Implement the requested change and run appropriate validation. Provide the reviewer with requirements,
        the diff, and evidence.
      output: Committed implementation and validation evidence.
      outcomes:
        completed:
          next: review
    - id: review
      participant: reviewer

      instructions: >-
        Independently inspect the implementation and validation. Request actionable changes and return to this
        review, or approve and prepare the change request for delivery. When you approve, this step delivers: no
        later agent step runs, so once the stream reaches completion-ready you are its delivery participant. Follow
        the delivery instructions in the advance response and finish the stream yourself; do not wait for another
        agent. CI results, pushes and review comments go to implement, while merge and close events reach you.
      output: An evidence-backed verdict or actionable feedback.
      outcomes:
        approved:
          next: finish
        changes-requested:
          returnTo: implement
  completion:
    mode: pr-merge
    followChanges: true
    # CI results, pushes and review comments reopen implement; merges still reach the finishing reviewer.
    changeEventsTo:
      step: implement
