id: solo-coding
description: One engineer implements, verifies, and prepares a change for delivery.
definition:
  schemaVersion: 1
  name: Solo Coding
  participants:
    engineer:
      agentTypeId: engineer
      tier: deep
      session: reuse-within-stream
  entry: implement
  routing:
    mode: guided
    returnTo: declared-only
    delegation: disabled
  limits:
    maxDelegations: 0
    onLimit: request-owner-input
  steps:
    - id: implement
      participant: engineer
      instructions: >-
        Implement the requested change in the work-stream workspace. Run appropriate validation, inspect your
        own diff, and prepare the change request. Work directly without spawning other agents. Ask the owner
        if the scope requires independent review or a different flow. This step delivers: when you complete it,
        the stream reaches completion-ready with you as its delivery participant. Follow the delivery instructions
        in the advance response and finish the stream yourself.
      output: Committed implementation, validation evidence, and a change request ready for delivery.
      outcomes:
        completed:
          next: finish
  completion:
    mode: pr-merge
    followChanges: true
