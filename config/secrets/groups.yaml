# Maps a qualifier group -> glob key-patterns. A holder of secrets:read:<group>
# (or secrets:write:<group>) may access only the secrets whose key matches a
# pattern in <group>. Bare secrets:read / secrets:write / secrets:* / * (admin)
# are unaffected and see everything. A key matching NO pattern is admin-only
# (fail closed). A key may match multiple groups (union); access is OR over the
# matched groups (most-permissive wins) — keep patterns non-overlapping for
# sensitive keys. Globs: '*' = any chars, '?' = one char, whole-string anchored.
groups:
  # Third-party service / channel / deployment integrations (Operator-visible).
  integration:
    - GITHUB_*
    - GIT_USER_*
    - LINEAR_*
    - DISCORD_*
    - SLACK_*
    - TELEGRAM_*
    - DEPLOY_*

  # AI / model / cloud provider credentials.
  provider:
    - OPENAI_*
    - ANTHROPIC_*
    - PROVIDER_AUTH_DATA
    - GOOGLE_SERVICE_ACCOUNT_JSON

  # Push / notification material.
  notification:
    - VAPID_*
    - APNS_*

  # Core platform secrets — most sensitive; never widened to integration.
  system:
    - FICUS_*
    # One release (Ficus rename): the retained TAU_* secret rows stay authorized until the bridge is removed.
    - TAU_*
    - '*ENCRYPTION_KEY'
