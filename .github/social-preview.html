<!doctype html>
<!--
  Source for .github/social-preview.png (GitHub → Settings → Social preview).
  Render at exactly 1280×640, device scale 1, after fonts load:
    playwright: page.goto(file://…/social-preview.html); page.screenshot({clip:{0,0,1280,640}})
  The mark is the same artwork as the app's TauLogo component.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&family=Geist:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        background: #0a0a12;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1280px;
        height: 640px;
        color: #edeaf5;
        font-family: Geist, system-ui, sans-serif;
      }
      .stars span {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #c4b5fd;
        opacity: 0.55;
      }
      .stars span:nth-child(3n) {
        width: 1px;
        height: 1px;
      }
      .glow {
        position: absolute;
        left: -200px;
        top: -260px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(124, 58, 237, 0.28), rgba(124, 58, 237, 0));
      }
      .brand {
        position: absolute;
        left: 96px;
        top: 118px;
        display: flex;
        align-items: center;
        gap: 36px;
      }
      .brand .mark {
        width: 150px;
        height: 150px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(124, 58, 237, 0.35);
      }
      .brand .word {
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 132px;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .tag {
        position: absolute;
        left: 96px;
        top: 326px;
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 56px;
        letter-spacing: -0.03em;
        line-height: 1.12;
        max-width: 1080px;
      }
      .tag em {
        font-style: normal;
        color: #c4b5fd;
      }
      .sub {
        position: absolute;
        left: 96px;
        top: 468px;
        font-size: 27px;
        color: #aaa6bb;
        font-weight: 400;
      }
      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 44px;
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        color: #aaa6bb;
      }
      .foot b {
        color: #edeaf5;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="stars" id="stars"></div>
      <div class="brand">
        <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="tau-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a855f7" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="76" fill="url(#tau-logo-grad)" />
          <text
            x="256"
            y="340"
            font-family="system-ui, -apple-system, sans-serif"
            font-size="280"
            font-weight="bold"
            fill="white"
            text-anchor="middle"
          >
            τ
          </text>
        </svg>
        <div class="word">Ficus</div>
      </div>
      <div class="tag">A workspace for <em>teams of AI agents.</em></div>
      <div class="sub">Self-hosted on your machine, with an optional cloud.</div>
      <div class="foot">
        <span><b>ficus.sh</b></span
        ><span>github.com/ficushq/tau &nbsp;·&nbsp; AGPL-3.0</span>
      </div>
    </div>
    <script>
      // deterministic starfield
      let s = 42
      const r = () => {
        s = (s * 16807) % 2147483647
        return s / 2147483647
      }
      const el = document.getElementById('stars')
      for (let i = 0; i < 70; i++) {
        const d = document.createElement('span')
        d.style.left = r() * 1280 + 'px'
        d.style.top = r() * 640 + 'px'
        el.appendChild(d)
      }
    </script>
  </body>
</html>
