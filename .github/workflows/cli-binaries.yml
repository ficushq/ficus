name: CLI Binaries
"on": 
  push: 
    branches: 
      - main
    tags: 
      - v*
  workflow_dispatch: null
permissions: 
  contents: write
jobs: 
  publish-cli-release: 
    name: Publish CLI release assets
    runs-on: ubuntu-24.04
    if: "${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}"
    steps: 
      - uses: actions/checkout@v7
        with: 
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with: 
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with: 
          path: "~/.bun/install/cache\nnode_modules\napps/*/node_modules\npackages/*/node_modules\n"
          key: "bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}"
          restore-keys: "bun-${{ runner.os }}-\n"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck CLI
        run: bun run --filter cli typecheck
      - name: "ficus-macos-arm64: Compile standalone binary"
        run: "mkdir -p dist/ficus-macos-arm64 dist/packages\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  export FICUS_CLI_VERSION=\"$GITHUB_REF_NAME\"\nelse\n  export FICUS_CLI_VERSION=\"nightly\"\nfi\nexport FICUS_CLI_COMMIT=\"$GITHUB_SHA\"\nexport FICUS_CLI_BUILD_DATE=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nnode -e \"const fs=require('fs');fs.writeFileSync('apps/cli/src/build-info.generated.ts', 'export const generatedBuildInfo = '+JSON.stringify({version:process.env.FICUS_CLI_VERSION,commit:process.env.FICUS_CLI_COMMIT,buildDate:process.env.FICUS_CLI_BUILD_DATE}, null, 2)+' as const\\\\n')\"\nbun build apps/cli/src/index.ts \\\n  --compile \\\n  --target=bun-darwin-arm64 \\\n  --outfile=dist/ficus-macos-arm64/ficus\nmkdir -p dist/ficus-macos-arm64/skills\ncp -R external/skills/. dist/ficus-macos-arm64/skills/\nchmod +x dist/ficus-macos-arm64/ficus\n"
      - name: "ficus-macos-arm64: Package Unix binary"
        run: tar -czf dist/packages/ficus-macos-arm64.tar.gz -C dist/ficus-macos-arm64 ficus skills
      - name: "ficus-macos-x64: Compile standalone binary"
        run: "mkdir -p dist/ficus-macos-x64 dist/packages\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  export FICUS_CLI_VERSION=\"$GITHUB_REF_NAME\"\nelse\n  export FICUS_CLI_VERSION=\"nightly\"\nfi\nexport FICUS_CLI_COMMIT=\"$GITHUB_SHA\"\nexport FICUS_CLI_BUILD_DATE=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nnode -e \"const fs=require('fs');fs.writeFileSync('apps/cli/src/build-info.generated.ts', 'export const generatedBuildInfo = '+JSON.stringify({version:process.env.FICUS_CLI_VERSION,commit:process.env.FICUS_CLI_COMMIT,buildDate:process.env.FICUS_CLI_BUILD_DATE}, null, 2)+' as const\\\\n')\"\nbun build apps/cli/src/index.ts \\\n  --compile \\\n  --target=bun-darwin-x64 \\\n  --outfile=dist/ficus-macos-x64/ficus\nmkdir -p dist/ficus-macos-x64/skills\ncp -R external/skills/. dist/ficus-macos-x64/skills/\nchmod +x dist/ficus-macos-x64/ficus\n"
      - name: "ficus-macos-x64: Package Unix binary"
        run: tar -czf dist/packages/ficus-macos-x64.tar.gz -C dist/ficus-macos-x64 ficus skills
      - name: "ficus-linux-arm64: Compile standalone binary"
        run: "mkdir -p dist/ficus-linux-arm64 dist/packages\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  export FICUS_CLI_VERSION=\"$GITHUB_REF_NAME\"\nelse\n  export FICUS_CLI_VERSION=\"nightly\"\nfi\nexport FICUS_CLI_COMMIT=\"$GITHUB_SHA\"\nexport FICUS_CLI_BUILD_DATE=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nnode -e \"const fs=require('fs');fs.writeFileSync('apps/cli/src/build-info.generated.ts', 'export const generatedBuildInfo = '+JSON.stringify({version:process.env.FICUS_CLI_VERSION,commit:process.env.FICUS_CLI_COMMIT,buildDate:process.env.FICUS_CLI_BUILD_DATE}, null, 2)+' as const\\\\n')\"\nbun build apps/cli/src/index.ts \\\n  --compile \\\n  --target=bun-linux-arm64 \\\n  --outfile=dist/ficus-linux-arm64/ficus\nmkdir -p dist/ficus-linux-arm64/skills\ncp -R external/skills/. dist/ficus-linux-arm64/skills/\nchmod +x dist/ficus-linux-arm64/ficus\n"
      - name: "ficus-linux-arm64: Package Unix binary"
        run: tar -czf dist/packages/ficus-linux-arm64.tar.gz -C dist/ficus-linux-arm64 ficus skills
      - name: "ficus-linux-x64: Compile standalone binary"
        run: "mkdir -p dist/ficus-linux-x64 dist/packages\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  export FICUS_CLI_VERSION=\"$GITHUB_REF_NAME\"\nelse\n  export FICUS_CLI_VERSION=\"nightly\"\nfi\nexport FICUS_CLI_COMMIT=\"$GITHUB_SHA\"\nexport FICUS_CLI_BUILD_DATE=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nnode -e \"const fs=require('fs');fs.writeFileSync('apps/cli/src/build-info.generated.ts', 'export const generatedBuildInfo = '+JSON.stringify({version:process.env.FICUS_CLI_VERSION,commit:process.env.FICUS_CLI_COMMIT,buildDate:process.env.FICUS_CLI_BUILD_DATE}, null, 2)+' as const\\\\n')\"\nbun build apps/cli/src/index.ts \\\n  --compile \\\n  --target=bun-linux-x64 \\\n  --outfile=dist/ficus-linux-x64/ficus\nmkdir -p dist/ficus-linux-x64/skills\ncp -R external/skills/. dist/ficus-linux-x64/skills/\nchmod +x dist/ficus-linux-x64/ficus\n"
      - name: "ficus-linux-x64: Smoke test Linux x64 binary"
        run: "./dist/ficus-linux-x64/ficus --help\n./dist/ficus-linux-x64/ficus --version | grep -v '^ (, )$'\n"
      - name: "ficus-linux-x64: Package Unix binary"
        run: tar -czf dist/packages/ficus-linux-x64.tar.gz -C dist/ficus-linux-x64 ficus skills
      - name: "ficus-windows-x64: Compile standalone binary"
        run: "mkdir -p dist/ficus-windows-x64 dist/packages\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  export FICUS_CLI_VERSION=\"$GITHUB_REF_NAME\"\nelse\n  export FICUS_CLI_VERSION=\"nightly\"\nfi\nexport FICUS_CLI_COMMIT=\"$GITHUB_SHA\"\nexport FICUS_CLI_BUILD_DATE=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nnode -e \"const fs=require('fs');fs.writeFileSync('apps/cli/src/build-info.generated.ts', 'export const generatedBuildInfo = '+JSON.stringify({version:process.env.FICUS_CLI_VERSION,commit:process.env.FICUS_CLI_COMMIT,buildDate:process.env.FICUS_CLI_BUILD_DATE}, null, 2)+' as const\\\\n')\"\nbun build apps/cli/src/index.ts \\\n  --compile \\\n  --target=bun-windows-x64 \\\n  --outfile=dist/ficus-windows-x64/ficus.exe\nmkdir -p dist/ficus-windows-x64/skills\ncp -R external/skills/. dist/ficus-windows-x64/skills/\nchmod +x dist/ficus-windows-x64/ficus.exe\n"
      - name: "ficus-windows-x64: Package Windows binary"
        run: cd dist/ficus-windows-x64 && zip -r ../packages/ficus-windows-x64.zip ficus.exe skills
      - name: Collect release assets
        run: "mkdir -p dist/release\nfind dist/packages -type f \\( -name '*.tar.gz' -o -name '*.zip' \\) -exec cp {} dist/release/ \\;\nif [ \"$GITHUB_REF_TYPE\" = \"tag\" ]; then\n  VERSION=\"$GITHUB_REF_NAME\"\nelse\n  VERSION=\"nightly\"\nfi\ncat > dist/release/manifest.json <<EOF\n{\n  \"version\": \"$VERSION\",\n  \"commit\": \"$GITHUB_SHA\",\n  \"buildDate\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"baseUrl\": \"https://ficus.sh/cli\",\n  \"assets\": {\n    \"macos-arm64\": \"ficus-macos-arm64.tar.gz\",\n    \"macos-x64\": \"ficus-macos-x64.tar.gz\",\n    \"linux-arm64\": \"ficus-linux-arm64.tar.gz\",\n    \"linux-x64\": \"ficus-linux-x64.tar.gz\",\n    \"windows-x64\": \"ficus-windows-x64.zip\"\n  }\n}\nEOF\n# install.sh/setup.sh are part of the published set — the host serves\n# them at https://ficus.sh/cli/{install,setup}.sh, which is what\n# every documented one-liner pipes into a shell.\ncp scripts/install.sh dist/release/install.sh\ncp scripts/setup.sh dist/release/setup.sh\n# Served straight to the public by the host's caddy file_server. The\n# host resets modes on publish too; setting them here keeps the\n# release archive itself sane for anyone downloading it directly.\nchmod 755 dist/release\nchmod 644 dist/release/*\nls -la dist/release\n"
      - name: Update nightly tag
        if: "github.ref == 'refs/heads/main'"
        continue-on-error: true
        run: "git tag -f nightly \"$GITHUB_SHA\"\ngit push origin nightly --force\n"
      - name: Publish nightly release
        if: "github.ref == 'refs/heads/main'"
        uses: softprops/action-gh-release@v3
        with: 
          tag_name: nightly
          name: Nightly
          body: "Automated CLI build for ${{ github.sha }}."
          make_latest: true
          prerelease: false
          files: dist/release/*
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Publish tagged release
        if: "github.ref_type == 'tag'"
        uses: softprops/action-gh-release@v3
        with: 
          files: dist/release/*
          fail_on_unmatched_files: true
          overwrite_files: true
concurrency: 
  group: "cli-release-${{ github.ref }}"
  cancel-in-progress: false