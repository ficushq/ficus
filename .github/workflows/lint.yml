name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - initiative/color-themes
      - ficus/rename

# Same posture as ci.yml: supersede a PR's own earlier runs, never a run on
# main. Lint is only ~1.3 minutes, but it fires on exactly the same push
# volume as CI does.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # No Bun dependency cache: a cold install is faster than restoring one (docs/wiki/ci-cd.md).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint
