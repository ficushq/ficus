name: Decision evals
# Live runs of the decision evals (`bun run decisions:eval`) against real providers. Manual only:
# they cost money, need provider keys, and model answers vary. The offline replay of recorded
# answers runs in normal CI (apps/core/src/services/decisions/evals/replay.test.ts).
'on':
  workflow_dispatch:
    inputs:
      evals:
        description: Evals to run, space-separated (empty for all; see `bun run decisions:eval --list`)
        required: false
        default: ''
      providers:
        description: Provider kinds to ask, comma-separated (jev, openai, cloudflare); empty for every configured one
        required: false
        default: ''
      repeat:
        description: Times to ask each case (2–3 shows answers that flip)
        required: false
        default: '1'
permissions:
  contents: read
jobs:
  live:
    name: Run decision evals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run
        env:
          FICUS_EVAL_JEV_API_KEY: ${{ secrets.FICUS_EVAL_JEV_API_KEY }}
          FICUS_EVAL_OPENAI_API_KEY: ${{ secrets.FICUS_EVAL_OPENAI_API_KEY }}
          FICUS_EVAL_CLOUDFLARE_API_KEY: ${{ secrets.FICUS_EVAL_CLOUDFLARE_API_KEY }}
          FICUS_EVAL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FICUS_EVAL_CLOUDFLARE_ACCOUNT_ID }}
          EVALS: ${{ inputs.evals }}
          PROVIDERS: ${{ inputs.providers }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -- $EVALS
          bun run decisions:eval "$@" --from env ${PROVIDERS:+--provider "$PROVIDERS"} --repeat "${REPEAT:-1}" --markdown "$GITHUB_STEP_SUMMARY"
