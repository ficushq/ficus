name: Cloudflare ranges

# The ingress Caddyfiles believe CF-Connecting-IP only from Cloudflare's edge
# ranges, pinned in scripts/setup/lib.sh (CLOUDFLARE_PROXY_RANGES). This job
# checks a change to that list (or to this check) against the list Cloudflare
# publishes. It runs for pull requests, so it is read-only; the weekly watch
# that opens an issue on drift is cloudflare-ranges-watch.yml.
on:
  pull_request:
    paths:
      - scripts/setup/lib.sh
      - scripts/ci/check-cloudflare-ranges.sh
      - .github/workflows/cloudflare-ranges.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare the pinned list with Cloudflare's
        run: scripts/ci/check-cloudflare-ranges.sh
