name: Bug report
description: Something in Ficus does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ficus version or commit
      description: '`ficus --version`, or the commit shown in Settings → About.'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Ficus installed
      options:
        - Self-hosted via setup.sh
        - Self-hosted from source
        - Docker image
        - Ficus Cloud (ficus.sh)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `ficus-api`, `ficus-worker` or the CLI. Remove tokens and secrets first.
      render: text
