version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 10 was saturated: further updates queued silently behind the open PRs.
    # The groups below also fold packages that must move together into one PR.
    open-pull-requests-limit: 15
    # The narrow groups come before the catch-all minor-and-patch group, but
    # order alone does not keep a dependency out of it: Dependabot gives a
    # dependency matching several groups to the most specific one, and a group
    # with no patterns (minor-and-patch) outranks a wildcard pattern such as
    # "@earendil-works/pi-*". Packages that must stay out of the catch-all
    # group are therefore listed in its exclude-patterns. Groups only shape
    # version updates; security updates still arrive as their own PRs.
    groups:
      # The Pi packages pin each other at one exact version, and pi-ai and
      # pi-coding-agent carry patches keyed to that version (patchedDependencies),
      # so every Pi bump is one migration: all four move together, in every
      # update type, and stay out of the catch-all group.
      pi:
        patterns: ["@earendil-works/pi-*"]
      # The Notion CLI (ntn) version and its npm tarball integrity are pinned in
      # apps/core/src/services/integrations/notion/plugin.ts (CLI_VERSION and
      # CLI_INTEGRITY), so every ntn bump needs a matching code change. Kept in its
      # own PR so it can't hold back the rest of the minor-and-patch group.
      ntn:
        patterns: ["ntn"]
      # drizzle-orm and drizzle-kit are 0.x: a "minor" bump can change behaviour.
      # Kept apart so it can't hold back the rest of the minor-and-patch group,
      # and kept together because the ORM and its migration kit must match.
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
        update-types: ["minor", "patch"]
      # ESLint majors land as one migration: eslint and @eslint/js must match,
      # and the plugins/config follow ESLint's major.
      lint-tooling-majors:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "prettier"
        update-types: ["major"]
      # Vite majors need the React plugin and the PWA plugin at matching majors.
      vite-majors:
        patterns: ["vite", "@vitejs/*", "vite-plugin-*"]
        update-types: ["major"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        # Pi and ntn updates always go to their groups above, never the catch-all.
        exclude-patterns: ["@earendil-works/*", "ntn"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
