# Core needs permission to manage pods and PVCs in the sandbox namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ficus-sandbox-manager
  namespace: ficus-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ficus-core-sandbox-manager
  namespace: ficus-sandboxes
subjects:
  - kind: ServiceAccount
    name: ficus-core
    namespace: ficus-core
roleRef:
  kind: Role
  name: ficus-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
