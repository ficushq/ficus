# Namespace for Ficus Core components
# Labels allow NetworkPolicy in ficus-sandboxes to select this namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ficus-core
  labels:
    app: ficus
    component: core
---
# ServiceAccount for Ficus Core
# Referenced by RBAC in k8s/rbac.yaml for sandbox management permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ficus-core
  namespace: ficus-core
  labels:
    app: ficus-core
