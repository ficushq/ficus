# Namespace for Ficus Core components
# Labels allow NetworkPolicy in tau-sandboxes to select this namespace
apiVersion: v1
kind: Namespace
metadata:
  name: tau-core
  labels:
    app: tau
    component: core
---
# ServiceAccount for Ficus Core
# Referenced by RBAC in k8s/rbac.yaml for sandbox management permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tau-core
  namespace: tau-core
  labels:
    app: tau-core
