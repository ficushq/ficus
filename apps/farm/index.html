<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a3bb5d" />
    <!-- Lets Ficus Desktop tell a Core that serves the farm from one whose /farm falls back to the web app. -->
    <meta name="ficus-app" content="farm" />
    <!-- The farm's own icons (brand/generated/farm, the farm's public dir). The manifest link is added by pwa.ts. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Launched from the home screen: full screen under a translucent status bar (the HUD keeps to the safe area). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farm" />
    <title>Ficus farm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
