<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a3bb5d" />
    <!-- Lets Ficus Desktop tell a Core that serves the farm from one whose /farm falls back to the web app. -->
    <meta name="ficus-app" content="farm" />
    <!-- The manifest, favicon and home-screen icon links are added by pwa.ts, with content-hashed URLs. -->
    <!-- Launched from the home screen: full screen under a translucent status bar (the HUD keeps to the safe area). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ficus Farm" />
    <title>Ficus Farm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
