services:
  postgres:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fifo_restart
    ports:
      - '${FIFO_RESTART_PORT}:5432'
    volumes:
      - 'fifo_restart_data:/var/lib/postgresql/data'
volumes:
  fifo_restart_data:
    name: '${FIFO_RESTART_VOLUME}'
