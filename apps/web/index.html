<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Ficus</title>

    <!-- PWA manifest link is injected at build time by vite-plugin-pwa
         (base-path aware manifest.webmanifest). -->

    <!-- Theme Color: initial light surface; the flash-prevention script below and
         ThemeProvider keep it in sync with the active theme's surface color. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' on purpose: on iOS 26 the translucent style shortens the webview
         by the status-bar height at the BOTTOM (viewport 812 on an 874pt screen),
         double-reports safe-area insets, and overlays an uncontrollable gray
         legibility scrim (with a visible hairline edge) on the top strip.
         'default' gives a full-height webview below an opaque bar that iOS colors
         from the system appearance / dynamic theme-color meta. NOTE: iOS snapshots
         this at Add-to-Home-Screen; changes require reinstalling the app icon. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ficus" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS Splash Screens (generated for common device sizes) -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/icon-512x512.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />

    <!-- Favicons: media-queried so the tab icon follows the OS scheme even
         before ThemeProvider resolves an in-app appearance. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/dark/favicon-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/dark/favicon-16x16.png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Microsoft Tile -->
    <meta name="msapplication-TileColor" content="#3f6b4f" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Description for SEO and sharing. __FICUS_ORIGIN__ is replaced by the
         server (apps/core/src/lib/web-serve.ts) with this instance's public
         origin: link crawlers ignore relative og:image / og:url values. -->
    <meta name="description" content="A workspace for teams of AI agents. Self-hosted, with an optional cloud." />
    <meta property="og:title" content="Ficus" />
    <meta
      property="og:description"
      content="A workspace for teams of AI agents. Self-hosted, with an optional cloud."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ficus" />
    <meta property="og:url" content="__FICUS_ORIGIN__/" />
    <meta property="og:image" content="__FICUS_ORIGIN__/social-preview.png?v=d68f57f443a4" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Ficus: Keep work moving while you’re away. Self-organizing agents that check in when they need you."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ficus" />
    <meta
      name="twitter:description"
      content="A workspace for teams of AI agents. Self-hosted, with an optional cloud."
    />
    <meta name="twitter:image" content="__FICUS_ORIGIN__/social-preview.png?v=d68f57f443a4" />

    <meta name="format-detection" content="telephone=no" />
